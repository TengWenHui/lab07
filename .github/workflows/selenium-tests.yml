name: Node.js Selenium Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install Node.js dependencies
        run: npm ci

      - name: Prepare artifacts
        run: |
          tar -czvf www-build.tar.gz package.json package-lock.json src tests
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: www-build
          path: www-build.tar.gz

  test:
    needs: build
    runs-on: ubuntu-latest

    container:
      image: node:22
      ports:
        - 3000
      options: --network-alias=testserver

    env:
      TEST_BASE_URL: http://testserver:3000
      SELENIUM_URL: http://selenium:4444/wd/hub
      SELENIUM_STATUS_URL: http://selenium:4444/status

    services:
      selenium:
        image: selenium/standalone-chrome
        options: --shm-size=2g

    steps:
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          name: www-build

      - name: Extract artifacts
        run: |
          tar -xzvf www-build.tar.gz
          ls -l

      - name: Install dependencies
        run: npm ci

      - name: List files for debugging
        run: |
          echo "Current directory:"
          pwd
          echo "Files in current directory:"
          ls -ltra
          echo "Files in src:"
          ls -ltra src
          echo "Files in tests:"
          ls -ltra tests

      - name: Run unit tests
        run: npm test

      - name: Start Node.js server
        run: |
          nohup node src/server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Node.js server
        run: |
          for i in $(seq 1 10); do
            if curl --fail http://localhost:3000; then
              exit 0
            fi

            echo "Waiting for Node.js server..."
            sleep 2
          done

          echo "Node.js server did not start."
          cat server.log
          exit 1

        - name: Wait for Selenium server
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent "$SELENIUM_STATUS_URL" | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; then
              echo "Selenium Grid is ready."
              exit 0
            fi

            echo "Waiting for Selenium..."
            sleep 3
          done

          echo "Selenium server did not become ready."
          curl --silent "$SELENIUM_STATUS_URL" || true
          exit 1

      - name: Run Selenium tests
        run: node tests/SeleniumTest.mjs github